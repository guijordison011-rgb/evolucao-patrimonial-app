<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Evolução Patrimonial</title>
<meta name="theme-color" content="#12392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evolução Patrimonial">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  color-scheme:light;
  --page:#f1f1eb;
  --surface:#fffefa;
  --surface-2:#f7f7f1;
  --ink:#18251f;
  --muted:#78857d;
  --line:#e1e5dd;
  --forest:#17382e;
  --forest-2:#254b3d;
  --forest-soft:#e8eee8;
  --gold:#b28d55;
  --gold-soft:#ddc79f;
  --positive:#34765d;
  --negative:#b75d52;
  --shadow:0 18px 44px -36px rgba(21,43,33,.34);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --page:#0c1511;--surface:#121e18;--surface-2:#18271f;--ink:#edf1eb;--muted:#91a097;--line:#293a30;
  --forest:#10271e;--forest-2:#1c3a2d;--forest-soft:#1d3026;--gold:#c7a36a;--gold-soft:#e0c48e;
  --positive:#75c49c;--negative:#e18479;--shadow:0 18px 44px -36px rgba(0,0,0,.75)
}}
:root[data-theme=dark]{color-scheme:dark;--page:#0c1511;--surface:#121e18;--surface-2:#18271f;--ink:#edf1eb;--muted:#91a097;--line:#293a30;--forest:#10271e;--forest-2:#1c3a2d;--forest-soft:#1d3026;--gold:#c7a36a;--gold-soft:#e0c48e;--positive:#75c49c;--negative:#e18479;--shadow:0 18px 44px -36px rgba(0,0,0,.75)}
:root[data-theme=light]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(800px 520px at 100% 0%,rgba(178,141,85,.055),transparent 64%),var(--page);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
.w{width:min(100% - 64px,1480px);margin:0 auto;padding:26px 0 76px;display:grid;grid-template-columns:226px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:46px;row-gap:25px;align-content:start;grid-template-areas:"top top" "sidebar app"}
.top{grid-area:top;display:flex;justify-content:space-between;align-items:center;padding:0 0 22px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:17px;letter-spacing:-.035em;font-weight:700;line-height:1}
.brand .brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--forest);color:var(--gold-soft);font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand small{align-self:center;margin-left:8px;padding-left:14px;border-left:1px solid var(--line);font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top>div:last-child{display:flex;align-items:center;gap:9px!important}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;font-size:12px;font-weight:650;letter-spacing:.01em;cursor:pointer;transition:background .18s,border-color .18s,transform .18s,box-shadow .18s}
.btn:hover{border-color:color-mix(in srgb,var(--gold) 52%,var(--line));background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.m:focus-visible,.seg div:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.g{background:var(--forest);color:#f7f5ee;border:1px solid var(--forest);font-weight:700;padding:10px 16px;box-shadow:0 5px 12px -8px rgba(23,56,46,.8)}
.btn.g:hover{background:var(--forest-2);border-color:var(--forest-2)}
.sidebar{grid-area:sidebar;display:flex;flex-direction:column;gap:23px;align-self:start;min-width:0}
.yr{display:flex;align-items:center;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--line);min-width:0}
.yr:before,.seg:before,.rail:before{display:block;color:var(--muted);font-size:9px;font-weight:750;letter-spacing:.17em;text-transform:uppercase}
.yr:before{content:"EXERCÍCIO";width:100%;margin-bottom:2px}
.yr{flex-wrap:wrap}
.yr .btn{padding:7px 10px;background:transparent;border-color:transparent;color:var(--muted);font-size:12px}
.yr .btn.on{color:var(--forest);background:var(--forest-soft);border-color:transparent;font-weight:750}
:root[data-theme=dark] .yr .btn.on{color:#dce8df}
.seg{display:flex;flex-direction:column;gap:4px;align-self:start;min-width:0;margin:0;padding:0}
.seg:before{content:"VISUALIZAÇÃO";margin:0 0 4px 10px}
.seg div{flex:initial;text-align:left;padding:10px 12px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:background .18s,color .18s;position:relative}
.seg div:hover{background:var(--surface-2);color:var(--ink)}
.seg .on{background:var(--forest-soft);color:var(--forest);font-weight:750}
.seg .on:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--gold)}
:root[data-theme=dark] .seg .on{color:#e5eee7}
.rail{display:flex;flex-direction:column;gap:3px;align-self:start;min-width:0;max-height:660px;overflow:auto;padding:2px 3px 10px 0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.rail:before{content:"COMPETÊNCIA";margin:1px 0 8px 10px}
.m{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;gap:10px;min-width:0;width:100%;text-align:left;padding:10px 11px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:background .18s,color .18s}
.m b{order:1;display:block;min-width:30px;color:inherit;font-weight:650}
.m>span{order:2;margin-left:auto;color:var(--muted);font-size:10px!important}
.m i{order:3;display:block;width:6px;height:6px;flex:0 0 6px;border-radius:50%;margin:0 2px 0 0;background:var(--line)}
.m.f i{background:var(--gold)}
.m:hover{background:var(--surface-2);color:var(--ink)}
.m.on{background:var(--forest);color:#f5f3ec;box-shadow:0 7px 16px -12px rgba(15,42,31,.8)}
.m.on b{color:inherit}.m.on i{background:var(--gold-soft)}.m.on>span{color:rgba(255,255,255,.62)}
#app{grid-area:app;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.9fr);gap:19px;align-content:start;min-width:0;}
#app:before{content:"VISÃO PATRIMONIAL";grid-column:1/-1;margin:0 0 -5px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.19em;text-transform:uppercase}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:23px 24px;margin:0;box-shadow:var(--shadow)}
.hero{grid-column:1/-1;position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(270px,.82fr);grid-template-rows:auto auto auto auto;gap:7px 34px;padding:31px 35px 30px;border:1px solid rgba(225,231,222,.08);border-radius:19px;background:linear-gradient(112deg,#142f26 0%,#1a3b30 57%,#23483a 100%);color:#f6f4ed;box-shadow:0 22px 48px -32px rgba(17,47,36,.62);min-height:274px}
.hero:before{content:"";position:absolute;z-index:-1;width:430px;height:430px;right:-140px;top:-225px;border:1px solid rgba(221,199,159,.16);border-radius:50%;box-shadow:0 0 0 34px rgba(221,199,159,.025),0 0 0 72px rgba(221,199,159,.02),0 0 0 111px rgba(221,199,159,.015)}
.hero:after{content:"";position:absolute;z-index:-1;right:0;bottom:0;width:58%;height:1px;background:linear-gradient(90deg,transparent,rgba(221,199,159,.35))}
.hero>.lb:first-child{grid-column:1/-1;grid-row:1;margin-bottom:9px;color:#b4c4b9;font-size:10px;letter-spacing:.2em;font-weight:750}
.lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{grid-column:1;grid-row:2;margin:0;color:#fffdf7;font-family:"Iowan Old Style","Baskerville",Georgia,serif;font-size:clamp(48px,5.2vw,69px);font-weight:400;letter-spacing:-.055em;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-family:-apple-system,BlinkMacSystemFont,"Avenir Next",sans-serif;font-size:15px;letter-spacing:.08em;color:#d2bb8f;font-weight:700;margin-right:9px;vertical-align:middle}
.delta{grid-column:1;grid-row:3;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:3px 0 4px}
.pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:750;letter-spacing:.015em;background:rgba(121,191,150,.13);border:1px solid rgba(145,211,173,.16)}
.up{color:#a2d6b5!important}.dn{color:#f0a49b!important}
.delta .lb{color:#a9b9ad;font-size:9px;letter-spacing:.14em}
.hero .goal-panel{grid-column:2;grid-row:2/5;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:5px 0 5px 31px;margin:0!important;border-left:1px solid rgba(230,238,229,.18);position:relative;z-index:1}
.hero .gl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:11px 0 5px;font-size:12px;color:#e4e8df}
.hero .gl span{font-size:10px;letter-spacing:.13em;font-weight:700;text-transform:uppercase;color:#c6d1c8!important}
.hero .gl em{font-style:normal;font-weight:700;color:#f5f1e7;font-size:12px;font-variant-numeric:tabular-nums}
.hero .gl a{color:#d8bc87!important;text-decoration:none}
.hero .bar{height:4px;border-radius:8px;background:rgba(255,255,255,.13);overflow:hidden;margin:0 0 4px}
.hero .bar div{height:100%;border-radius:8px;background:linear-gradient(90deg,#b08b53,#e3cfaa);transition:width .6s}
.hero>.btn{grid-column:1;grid-row:4;justify-self:start;align-self:end;margin:5px 0 0!important;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.17);color:#f4f2e9;border-radius:7px;padding:8px 12px;font-size:11px;box-shadow:none}
.hero>.btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
h3{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 17px;color:var(--muted);font-size:10px;letter-spacing:.17em;text-transform:uppercase;font-weight:800}
#app>.card:nth-child(2){grid-column:1;min-height:258px}
#app>.card:nth-child(3){grid-column:2;min-height:258px}
#app>.card:nth-child(n+4){grid-column:1/-1}
#app>.card:nth-child(2) svg{display:block;width:100%;height:auto;overflow:visible;margin-top:5px}
#app>.card:nth-child(3){display:flex;flex-direction:column;justify-content:flex-start}
.leg{display:flex;gap:18px;align-items:center;min-height:170px}
.leg svg{width:116px;height:116px;flex:0 0 116px;overflow:visible}
.leg ul{list-style:none;margin:0;padding:0;flex:1;min-width:0;font-size:11px}
.leg li{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.leg li:last-child{border-bottom:0}.leg li:before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--c)}.leg li span{flex:1;min-width:0}.leg li b{color:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:17px 0 5px;padding:12px 13px;border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:750;cursor:pointer;transition:background .18s}
.grp:hover{background:var(--forest-soft)}.grp span{color:var(--forest);font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
:root[data-theme=dark] .grp span{color:#b6c9ba}
.sub{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:15px 0 1px;padding:8px 8px 9px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.sub b{color:var(--ink);font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
.it{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 5px;border-top:1px solid var(--line);transition:background .16s}
.it:hover{background:var(--surface-2)}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:9px;letter-spacing:.03em;font-weight:800;background:var(--forest-soft);color:var(--forest);flex:none}
:root[data-theme=dark] .av{color:#d7e5da}
.it .n{flex:1;min-width:0;color:var(--ink);font-size:12px;font-weight:650}
.it .n small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:1px}
.it input{width:128px;max-width:40%;text-align:right;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px;color:var(--ink);font:inherit;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
.it input:hover{background:var(--surface-2)}
.it input:focus{outline:0;border-color:var(--gold);background:var(--surface-2)}
.x{color:var(--muted);cursor:pointer;padding:5px 7px;border-radius:6px;font-size:12px}.x:hover{background:rgba(183,93,82,.1);color:var(--negative)}
.add{width:100%;margin-top:10px;border:1px dashed #c9d1c8;background:transparent;color:var(--forest);border-radius:8px;padding:10px;font-size:11px;font-weight:700;cursor:pointer;transition:background .18s,border .18s}
.add:hover{background:var(--forest-soft);border-color:var(--gold)}
:root[data-theme=dark] .add{color:#c8d9cc;border-color:var(--line)}
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;min-width:560px}th{background:var(--surface-2);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:11px 10px;font-weight:800}td{text-align:right;padding:12px 10px;border-top:1px solid var(--line);color:var(--muted)}td b{color:var(--ink)}th:first-child,td:first-child{text-align:left}tr.c{cursor:pointer}tr.c:hover td{background:var(--forest-soft)}
input.f,select.f{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:12px;font-size:13px;margin:6px 0 10px;outline:none}
input.f:focus,select.f:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(178,141,85,.12)}
textarea{width:100%;height:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font:12px ui-monospace,SFMono-Regular,monospace;margin:10px 0;outline:none}
.opt{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.ph{color:var(--muted);font-size:11px;margin:0}
.sh{position:fixed;inset:0;background:rgba(7,20,14,.54);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sh.o{display:flex}
.sh>div{background:var(--surface);color:var(--ink);width:100%;max-width:580px;border-radius:22px 22px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);box-shadow:0 -20px 65px rgba(0,0,0,.16)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 18px;border-radius:8px;font-size:12px;font-weight:650;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media(max-width:1050px){
  .w{width:min(100% - 40px,920px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"top" "sidebar" "app";row-gap:17px;column-gap:0;padding-top:20px}
  .sidebar{gap:13px}
  .yr{padding-bottom:0;border:0;align-items:center}.yr:before{width:auto;margin-right:5px}
  .seg{flex-direction:row;align-items:center;border-bottom:1px solid var(--line);padding-bottom:9px}.seg:before{margin:0 12px 0 0}.seg div{padding:8px 12px}.seg .on:before{left:8px;right:8px;top:auto;bottom:-10px;width:auto;height:2px}
  .rail{max-height:none;flex-direction:row;overflow-x:auto;gap:6px;padding:0 0 5px}.rail:before{display:none}
  .m{width:auto;min-width:51px;flex:0 0 auto;display:flex;flex-direction:column;gap:4px;justify-content:center;padding:8px 10px;text-align:center;border:1px solid var(--line);background:var(--surface)}.m b{min-width:0}.m>span{display:none}.m i{margin:0 auto}.m.on{background:var(--forest);border-color:var(--forest)}
  #app{grid-template-columns:minmax(0,1.45fr) minmax(260px,.9fr);gap:16px}
}
@media(max-width:720px){
  .w{width:min(100% - 28px,620px);padding:16px 0 calc(36px + env(safe-area-inset-bottom,0px));row-gap:15px}
  .top{padding-bottom:16px}.brand{font-size:16px}.brand small{font-size:8px;padding-left:9px;margin-left:2px}
  .top>div:last-child{gap:6px!important}.top .btn{padding:8px 10px;font-size:11px}
  .yr{flex-wrap:wrap;gap:6px}.yr:before{font-size:8px}.yr .btn{padding:6px 8px}
  #app{grid-template-columns:minmax(0,1fr);gap:13px}
  #app>.card:nth-child(2),#app>.card:nth-child(3),#app>.card:nth-child(n+4){grid-column:1/-1;min-height:0}
  .card{padding:19px;border-radius:13px}
  .hero{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto;gap:8px;padding:23px 21px 21px;border-radius:15px;min-height:0}
  .hero>.lb:first-child{grid-column:1;grid-row:1;margin-bottom:4px}
  .big{grid-column:1;grid-row:2;font-size:clamp(43px,12vw,57px)}
  .delta{grid-column:1;grid-row:3;margin:0 0 5px}
  .hero .goal-panel{grid-column:1;grid-row:4;border-left:0;border-top:1px solid rgba(230,238,229,.18);padding:12px 0 0;margin-top:3px!important}
  .hero>.btn{grid-column:1;grid-row:5;margin-top:7px!important}
  .leg{min-height:145px;gap:15px}.leg svg{width:102px;height:102px;flex-basis:102px}.leg ul{font-size:10px}
  .grp{font-size:12px;padding:11px}.grp span{font-size:11px}
}
@media(max-width:390px){
  .brand small{display:none}.top .btn{padding:8px 9px}.card{padding:16px}.hero{padding:21px 18px}.leg{gap:10px}.leg svg{width:88px;height:88px;flex-basis:88px}.leg li{font-size:10px}.it{gap:8px}.it input{width:112px;padding:6px 4px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

.hero .dg{grid-column:1;grid-row:3;display:flex;flex-direction:column;gap:12px}.hero .dg .delta{grid-column:auto;grid-row:auto}
.gross{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 13px;border:1px solid rgba(221,199,159,.26);border-radius:9px;background:rgba(255,255,255,.06);font-size:10px;font-weight:700;letter-spacing:.14em;color:#c6d1c8}.gross>div{display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px}.gross i{font-style:normal;letter-spacing:.02em;font-weight:500;opacity:.8;font-size:11px}.gross b{font-family:"Iowan Old Style",Georgia,serif;font-size:21px;font-weight:400;letter-spacing:-.02em;color:#f1e3c2;font-variant-numeric:tabular-nums}.gross .mini{padding:7px 11px;font-size:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#f4f2e9}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;margin:8px 0 14px}.tabs div{flex:1;text-align:center;padding:9px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.tabs .on{background:var(--forest);color:#f7f5ee}

.logo{display:block;height:64px;width:106.1px;background:var(--forest);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
@media (prefers-color-scheme:dark){:where(:root:not([data-theme=light])) .logo{background:var(--gold)}}
:where(:root[data-theme=dark]) .logo{background:var(--gold)}
.hero .wm{position:absolute;z-index:-1;right:-30px;bottom:-34px;width:497px;height:300px;background:#e0c48e;opacity:.05;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;pointer-events:none}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11px;color:var(--muted)}.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs div{white-space:nowrap;flex:1 0 auto;padding:9px 14px}
.clogo{width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}.clogo img{width:100%;height:100%;object-fit:cover}
.leg li small{display:block;color:var(--muted);font-size:10px}
@media(max-width:700px){.it input,input.f,select.f{font-size:16px}.logo{height:46px;width:76.3px}}
@media(max-width:1050px){.rail{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;overflow:visible!important}.rail:before{grid-column:1/-1}.rail .m{min-width:0;width:auto;padding:9px 0}.rail .m b{min-width:0}}
@media(max-width:1050px){.rail{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;overflow:visible!important;flex-direction:initial;padding:0}.rail .m{min-width:0;width:auto;padding:9px 0}.rail .m b{min-width:0}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}.stats b{display:block;font-family:"Iowan Old Style",Georgia,serif;font-size:28px;font-weight:400;letter-spacing:-.02em;margin:7px 0 3px;font-variant-numeric:tabular-nums}.stats small{color:var(--muted);font-size:11px}
tr.c .mt{white-space:nowrap;color:var(--muted);font-size:10px}
.btn:disabled{opacity:.4;pointer-events:none}
#authGate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(circle at 50% 0%,rgba(188,158,101,.16),transparent 38%),linear-gradient(145deg,#071b13,#12392b 58%,#0b241a);color:#f5f0df}
body.app-authenticated #authGate{display:none!important}
body:not(.app-authenticated) .w{display:none!important}
.auth-panel{width:min(100%,420px);padding:30px 25px 24px;border:1px solid rgba(219,196,148,.28);border-radius:24px;background:rgba(8,29,20,.86);box-shadow:0 26px 80px rgba(0,0,0,.3);backdrop-filter:blur(16px)}
.auth-logo{display:block;width:116px;height:116px;object-fit:cover;border-radius:24px;margin:0 auto 20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.auth-kicker{text-align:center;color:#d7b46d;font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.auth-panel h1{text-align:center;font-family:Georgia,serif;font-weight:500;font-size:34px;line-height:1.08;margin:9px 0 9px;color:#f3eddb}
.auth-panel h1 span{display:block;color:#e3bc6d}
.auth-lede{text-align:center;color:#c4cfc5;font-size:13px;line-height:1.55;margin:0 0 24px}
.auth-field{display:block;margin:0 0 13px;color:#e4decf;font-size:12px;font-weight:700}
.auth-field input{display:block;width:100%;margin-top:7px;padding:14px 13px;border:1px solid rgba(220,205,170,.24);border-radius:11px;background:#f8f6ed;color:#172b20;font-size:16px;outline:none}
.auth-field input:focus{border-color:#d7b46d;box-shadow:0 0 0 3px rgba(215,180,109,.16)}
.auth-submit,.auth-create{width:100%;border-radius:11px;padding:14px 16px;font-size:14px;font-weight:800;cursor:pointer}
.auth-submit{border:1px solid #d4ad62;background:linear-gradient(120deg,#e0c17b,#c59a4d);color:#183124;margin-top:5px}
.auth-create{border:1px solid rgba(230,215,178,.35);background:rgba(255,255,255,.07);color:#f0e9d6;margin-top:9px}
.auth-submit:disabled,.auth-create:disabled{opacity:.55;cursor:wait}
.auth-message{min-height:36px;text-align:center;color:#c7d0c5;font-size:12px;line-height:1.5;margin-top:15px}
.auth-footnote{text-align:center;color:#8fa193;font-size:9px;letter-spacing:.16em;margin-top:14px}

function dom(n){n=String(n||'').toLowerCase().trim();const m=n.match(/(?:https?:\/\/)?(?:www\.)?([a-z0-9-]+(?:\.[a-z0-9-]+)*\.[a-z]{2,})(?:\/[^\s]*)?/i);if(m)return m[1];for(const k of Object.keys(DOM).sort((a,b)=>b.length-a.length))if(n.includes(k))return DOM[k];return ''}
function faviconUrl(domain){return domain?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=128':''}
function lurl(n,sec){n=String(n||'');if(sec=='cri'){const q=n.toLowerCase();const cryptoMap={bitcoin:'btc',btc:'btc',ethereum:'eth',eth:'eth',xrp:'xrp',solana:'sol',sol:'sol',dogecoin:'doge',doge:'doge',cardano:'ada',ada:'ada'};const t=Object.keys(cryptoMap).find(k=>q.includes(k));return t?'https://cdn.jsdelivr.net/npm/cryptocurrency-icons@0.18.1/svg/color/'+cryptoMap[t]+'.svg':''}return faviconUrl(dom(n))}
function brandQuery(name,issuer,code){let q=String(issuer||'').trim()||[name,code].filter(Boolean).join(' ');q=q.replace(/\b(cdb|lci|lca|rdb|lc|cra|cri|deb[eê]nture|tesouro direto|tesouro|renda fixa|a[cç][aã]o|a[cç][oõ]es|fii|fundo imobili[aá]rio|etf|bdr|cripto|criptomoeda|ativo|conta|caixinha|c[oó]rrego|banco)\b/gi,' ').replace(/\b[A-Z]{4}\d{1,2}\b/gi,' ').replace(/\b\d{2,6}\b/g,' ').replace(/[·|,;]+/g,' ').replace(/\s+/g,' ').trim();return q||String(name||'').trim()}
function normBrand(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(sa|s a|s\/a|s\.a|ltda|inc|corp|corporation|company|banco|bank)\b/g,' ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function companyMatchScore(q,item){const a=normBrand(q),b=normBrand(item?.name),d=normBrand(String(item?.domain||'').split('.')[0]);if(!a||!b||!item?.domain)return 0;if(a===b)return 100;if(b===a.split(' ')[0]||a===b.split(' ')[0])return 82;if(a.includes(b)||b.includes(a))return 76;const aa=new Set(a.split(' ')),bb=new Set(b.split(' '));let common=0;for(const t of aa)if(t.length>2&&bb.has(t))common++;const ratio=common/Math.max(1,Math.min(aa.size,bb.size));if(ratio>=.75)return 68;if(d&&a===d)return 90;if(d&&a.includes(d))return 78;return 0}
async function searchCompanyDomain(query){const q=String(query||'').trim();if(!q||q.length<3)return '';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);try{const url='https://autocomplete.clearbit.com/v1/companies/suggest?query='+encodeURIComponent(q);const response=await fetch(url,{headers:{Accept:'application/json'},signal:controller.signal});if(!response.ok)return '';const results=await response.json();if(!Array.isArray(results)||!results.length)return '';const ranked=results.map(item=>({item,score:companyMatchScore(q,item)})).sort((a,b)=>b.score-a.score);return ranked[0]?.score>=65?String(ranked[0].item.domain||'').toLowerCase():''}catch(error){console.info('Busca automática de domínio indisponível:',error?.message||error);return ''}finally{clearTimeout(timer)}}

/* extrai, de um bloco de texto de um cartão, o valor total da posição (qtd × cotação) */
function pick(txt){const A=[],re=/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})(?!\d)(\s*%)?/g;let m;while((m=re.exec(txt))){if(m[2])continue;const v=brn(m[1]);if(v>0)A.push(v)}

document.getElementById('pxT').innerHTML=`Total a importar: <b>${R(tt)}</b> · ${rs.filter(r=>tm[r.t.trim()]).length} a atualizar · ${rs.filter(r=>!tm[r.t.trim()]).length} novo(s) · ${rs.filter(r=>r.need&&!r.chk).length} para conferir`;

function pxApply(){const Y=PX.y,Mi=PX.m,rs=PX.rows.filter(r=>!r.del),tm=TM(),ab=pxAb(),bk=K()+'_bkp',old=JSON.parse(JSON.stringify(S));
try{const b=JSON.parse(localStorage.getItem(bk)||'[]');b.unshift({t:Date.now(),y:Y,m:Mi,d:old});localStorage.setItem(bk,JSON.stringify(b.slice(0,3)))}catch(e){throw new Error('não consegui criar a cópia de segurança')}
const d=JSON.parse(JSON.stringify(S)),om=(old.years[Y]&&old.years[Y].m[Mi])||null;d.years[Y]=d.years[Y]||{g:{b:0,o:0,d:0},m:{}};const m=d.years[Y].m[Mi]=d.years[Y].m[Mi]||{},pre={},cr=[],lgK=[],st={up:0,nw:0,zr:0,kp:0,cf:rs.filter(r=>r.need).length},set=(k,v)=>{if(!(k in pre))pre[k]=om&&k in om?om[k]:null;m[k]=v};
d.logos=d.logos||{};const lgs=(k,r)=>{if(r.lg&&!LG[k]&&!d.logos[k]){d.logos[k]=r.lg;lgK.push(k)}};
rs.forEach((r,i)=>{const t=r.t.trim(),h=tm[t];if(h){set(h.k,r.v);lgs(h.k,r);st.up++}else{const k='x'+Date.now()+'_'+i,nm=r.nome.trim()||t;d.custom.push({k,n:nm,c:t,t,s:r.cat,l:lurl(nm+' '+t,r.cat)});cr.push(k);set(k,r.v);lgs(k,r);st.nw++}});

for(const k in (om||{}))if(!(k in pre)&&om[k]!==m[k])throw new Error('verificação: item fora da importação seria alterado');
S=d;
try{localStorage.setItem(K()+'_undo',JSON.stringify({y:Y,m:Mi,pre,cr,lg:lgK,had:!!om,t:Date.now()}))}catch(e){st.noundo=1}
S=d;return st}

function pxU(){const u=PXU();if(!u)return;const d=JSON.parse(JSON.stringify(S)),mo=d.years[u.y]&&d.years[u.y].m[u.m];if(!mo){toast('Nada a desfazer');return}
for(const k in u.pre){if(u.pre[k]===null)delete mo[k];else mo[k]=u.pre[k]}if(!u.had&&!Object.keys(mo).length)delete d.years[u.y].m[u.m];

 if(event==='SIGNED_OUT'){showAuth();}
